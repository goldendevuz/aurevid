[project]
name = "aurevid-backend"
version = "0.1.0"
description = "Aurevid API: multi-provider AI image studio backend"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "email-validator==2.4.0",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "limits==5.8.0",
    "numpy==2.5.5",
    "onnxruntime==1.32.0",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "python-multipart==0.0.34",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S107", "ASYNC240"]
"app/moderation.py" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]
